{% extends "base.html" %}

{% block content %}

<div class="card p-4 shadow col-md-6 mx-auto">

<h3 class="text-center">Register</h3>

<form method="POST">

<input class="form-control mb-3" name="username" placeholder="Username">

<input class="form-control mb-3" name="email" type="email" placeholder="Email">

<input class="form-control mb-3" name="password" type="password" placeholder="Password">

<button class="btn btn-primary w-100">Register</button>

</form>

</div>

{% endblock %}
